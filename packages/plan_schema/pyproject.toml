[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plan_schema"
version = "0.1.0"
description = "Single source of truth for floor-plan geometry JSON (Pydantic v2)."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "shapely>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
plan-schema = "plan_schema.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
