[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video_worker"
version = "0.1.0"
description = "Video generation via Together Seedance 2.5 (frames_only mode)."
requires-python = ">=3.11"
dependencies = [
    "together>=1.3",
    "requests>=2.31",
    "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
video-worker = "video_worker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
