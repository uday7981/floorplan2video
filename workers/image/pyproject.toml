[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "image_worker"
version = "0.1.0"
description = "End-frame image generation via OpenAI Images edit."
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "Pillow>=10",
    "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
image-worker = "image_worker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
